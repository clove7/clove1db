[package]
name = "clove1db"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
authors = ["clove7"]
description = "Embedded database for Rust on redb: typed entities and queries, automatic indexes, history and restore, a durable change log, attachments, migrations, and optional encryption of the whole database or of single fields."
repository = "https://github.com/clove7/clove1db"
keywords = ["database", "embedded", "redb", "encryption", "index"]
categories = ["database", "database-implementations", "caching"]
readme = "README.md"
exclude = ["examples/**"]

# docs.rs builds the documentation with these features, so the derive macro and the encryption API are documented too.
[package.metadata.docs.rs]
features = ["derive", "encryption"]

[features]
default = []
# The derive macro: #[derive(CloveFields)]. Without it, write the field constants by hand.
derive = ["dep:clove1db-derive"]
# All encryption: of a whole database and of protected fields. It needs the derive macro.
encryption = ["derive", "dep:aes-gcm", "dep:aes-gcm-siv", "dep:chacha20poly1305", "dep:argon2", "dep:scrypt", "dep:hkdf", "dep:hmac", "dep:sha2", "dep:sha3", "dep:zeroize", "dep:subtle", "dep:getrandom"]
# Process-exit crash points for durability tests (CLOVE_CRASH_POINT=...).
crash-inject = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(clove_test_encrypt_all)',
] }

[dependencies]
fst = { version = "0.4.7", features = ["levenshtein"] }
strsim = "0.11.1"
clove1db-derive = { path = "derive", version = "0.1.0", optional = true }
chrono = "0.4.45"
itertools = "0.15.0"
moka = { version = "0.12.16", features = ["sync"] }
redb = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
aes-gcm = { version = "0.11.1", features = ["zeroize"], optional = true }
aes-gcm-siv = { version = "0.12.1", features = ["zeroize"], optional = true }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"], optional = true }
argon2 = { version = "0.6.0", features = ["zeroize"], optional = true }
scrypt = { version = "0.12.0", optional = true }
hkdf = { version = "0.13.0", optional = true }
hmac = { version = "0.13.0", features = ["zeroize"], optional = true }
sha2 = { version = "0.11.1", features = ["zeroize"], optional = true }
sha3 = { version = "0.12.0", features = ["zeroize"], optional = true }
blake3 = { version = "1.8.7", features = ["zeroize"] }
zeroize = { version = "1.9.1", optional = true }
subtle = { version = "2.6.1", optional = true }
getrandom = { version = "0.4.3", optional = true }

[dev-dependencies]
# Tests only: without `cache_metrics`, redb reports its cache as empty, and the
# redb cache cap could not be checked against what redb actually holds.
redb = { version = "4.3.0", features = ["cache_metrics"] }

