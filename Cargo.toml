[workspace]
members = [".", "derive"]
exclude = [
    "examples/01_getting_started",
    "examples/02_queries_and_indexes",
    "examples/03_backup_and_batches",
    "examples/04_change_log",
    "examples/05_files_and_memory",
    "examples/06_encryption",
    "examples/07_migration_and_recovery",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
rust-version = "1.89"

# Tests only: the dependencies (Argon2, the ciphers, redb) are built optimised; the library itself stays unoptimised.
[profile.dev.package."*"]
opt-level = 3
